aid: iterable
name: Iterable
description: Iterable is an AI customer engagement platform that powers unified cross-channel
  marketing experiences and empowers marketers to create, optimize, and measure relevant
  interactions across email, push, SMS, in-app, and web channels. Their developer
  platform provides REST APIs, export APIs, AsyncAPI webhooks, and native SDKs for
  web, iOS, Android, and React Native.
