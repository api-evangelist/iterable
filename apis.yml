apis:
- aid: iterable:export-api
  name: Iterable Export API
  tags:
  - Analytics
  - Data Export
  - Marketing Data
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.iterable.com
  humanURL: >-
    https://support.iterable.com/hc/en-us/articles/204780579-Iterable-API-Endpoints-and-Sample-Payloads
  properties:
  - url: >-
      https://support.iterable.com/hc/en-us/articles/204780579-Iterable-API-Endpoints-and-Sample-Payloads
    type: Documentation
  - type: OpenAPI
    url: openapi/iterable-export-api-openapi.yml
  - type: Overlay
    url: overlays/iterable-export-api-overlay.yaml
  description: >-
    The Iterable Export API enables developers to extract data from Iterable projects for analytics, reporting,
    and data warehousing purposes. It provides asynchronous export endpoints that allow bulk retrieval
    of user data, event data, campaign metrics, and message engagement information. The export endpoints
    support filtering by date ranges and other criteria, making it possible to build custom reporting
    pipelines and synchronize Iterable data with external business intelligence tools.
- aid: iterable:web-sdk
  name: Iterable Web SDK
  tags:
  - In-App Messaging
  - JavaScript
  - SDK
  - User Tracking
  - Web
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.iterable.com
  humanURL: https://github.com/Iterable/iterable-web-sdk
  properties:
  - url: https://github.com/Iterable/iterable-web-sdk
    type: Documentation
  description: >-
    The Iterable Web SDK enables developers to integrate Iterable's marketing automation capabilities
    directly into JavaScript and Node.js applications. It provides functions for tracking user events,
    managing user profiles, displaying in-app messages, and handling web push notifications.
- aid: iterable:ios-sdk
  name: Iterable iOS SDK
  tags:
  - In-App Messaging
  - iOS
  - Mobile
  - Push Notifications
  - SDK
  - Swift
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.iterable.com
  humanURL: https://support.iterable.com/hc/en-us/articles/360035018152-Iterable-s-iOS-SDK
  properties:
  - url: https://support.iterable.com/hc/en-us/articles/360035018152-Iterable-s-iOS-SDK
    type: Documentation
  description: >-
    The Iterable iOS SDK allows developers to integrate Iterable's marketing automation features into
    native iOS applications built with Swift or Objective-C. It supports push notifications, in-app messages,
    deep links, and Mobile Inbox functionality. The SDK can be installed via Swift Package Manager, CocoaPods,
    or Carthage, and supports iOS 10 and higher. It enables mobile apps to track user events, display
    targeted in-app content, and participate in Iterable's cross-channel marketing campaigns.
- aid: iterable:android-sdk
  name: Iterable Android SDK
  tags:
  - Android
  - In-App Messaging
  - Mobile
  - Push Notifications
  - SDK
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.iterable.com
  humanURL: >-
    https://support.iterable.com/hc/en-us/articles/360028925511-Overview-of-Iterable-s-iOS-and-Android-SDKs
  properties:
  - url: >-
      https://support.iterable.com/hc/en-us/articles/360028925511-Overview-of-Iterable-s-iOS-and-Android-SDKs
    type: Documentation
  description: >-
    The Iterable Android SDK provides native integration between Android applications and the Iterable
    marketing automation platform. It supports push notifications, in-app messages, deep links, and Mobile
    Inbox features. The open-source SDK enables Android apps to track user events, manage user profiles,
    render in-app content, and connect with Iterable's cross-channel campaign orchestration. Developers
    can use it to deliver personalized marketing experiences within their Android applications.
- aid: iterable:react-native-sdk
  name: Iterable React Native SDK
  tags:
  - Cross-Platform
  - JavaScript
  - Mobile
  - React Native
  - SDK
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.iterable.com
  humanURL: >-
    https://support.iterable.com/hc/en-us/articles/360045714072-Overview-of-Iterable-s-React-Native-SDK
  properties:
  - url: >-
      https://support.iterable.com/hc/en-us/articles/360045714072-Overview-of-Iterable-s-React-Native-SDK
    type: Documentation
  description: >-
    The Iterable React Native SDK enables developers to integrate Iterable's marketing automation capabilities
    into cross-platform mobile applications built with React Native. It wraps Iterable's native iOS and
    Android SDKs and supports both JavaScript and TypeScript. The SDK provides access to push notifications,
    in-app messages, Mobile Inbox, user event tracking, and deep linking.
