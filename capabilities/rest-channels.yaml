naftiko: 1.0.0-alpha2
info:
  label: Iterable REST API — Channels
  description: 'Iterable REST API — Channels. 1 operations. Lead operation: List channels. Self-contained Naftiko capability
    covering one Iterable business surface.'
  tags:
  - Iterable
  - Channels
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ITERABLE_API_KEY: ITERABLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-channels
    baseUri: https://api.iterable.com/api
    description: Iterable REST API — Channels business capability. Self-contained, no shared references.
    resources:
    - name: channels
      path: /channels
      operations:
      - name: listchannels
        method: GET
        description: List channels
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Api-Key
      value: '{{env.ITERABLE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-channels-rest
    port: 8080
    description: REST adapter for Iterable REST API — Channels. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/channels
      name: channels
      description: REST surface for channels.
      operations:
      - method: GET
        name: listchannels
        description: List channels
        call: rest-channels.listchannels
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-channels-mcp
    port: 9090
    transport: http
    description: MCP adapter for Iterable REST API — Channels. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-channels
      description: List channels
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-channels.listchannels
      outputParameters:
      - type: object
        mapping: $.
