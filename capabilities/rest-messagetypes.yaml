naftiko: 1.0.0-alpha2
info:
  label: Iterable REST API — MessageTypes
  description: 'Iterable REST API — MessageTypes. 1 operations. Lead operation: List message types. Self-contained Naftiko
    capability covering one Iterable business surface.'
  tags:
  - Iterable
  - MessageTypes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ITERABLE_API_KEY: ITERABLE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-messagetypes
    baseUri: https://api.iterable.com/api
    description: Iterable REST API — MessageTypes business capability. Self-contained, no shared references.
    resources:
    - name: messageTypes
      path: /messageTypes
      operations:
      - name: listmessagetypes
        method: GET
        description: List message types
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Api-Key
      value: '{{env.ITERABLE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: rest-messagetypes-rest
    port: 8080
    description: REST adapter for Iterable REST API — MessageTypes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/messagetypes
      name: messagetypes
      description: REST surface for messageTypes.
      operations:
      - method: GET
        name: listmessagetypes
        description: List message types
        call: rest-messagetypes.listmessagetypes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-messagetypes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Iterable REST API — MessageTypes. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-message-types
      description: List message types
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-messagetypes.listmessagetypes
      outputParameters:
      - type: object
        mapping: $.
