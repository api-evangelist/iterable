  compatibility_statement: >-
    Iterable may add fields to API response bodies without prior notice and requires clients to
    tolerate new fields. It states it will not rename or remove existing documented response fields
    without prior communication. Response schemas are otherwise subject to change without notice.
deprecation:
  api_policy_url: null
  api_policy: >-
    Iterable publishes no REST API deprecation policy and no Sunset/Deprecation header support. No
    operation in the published Swagger document is marked deprecated (checked 2026-08-13).
  sunset_header: false
  sdk_policy_url: https://support.iterable.com/hc/en-us/articles/360046136171-SDK-Support-Policy
  sdk_policy: >-
    A deprecated SDK version is an iOS, Android, React Native or web SDK version with an announced
    end-of-life date. An SDK version's end-of-life date is 12 months after the release of its
    successor. Through that date Iterable investigates bugs and answers questions; after it, Iterable
    does not guarantee message delivery to apps on that version and may turn off message serving if
    severe bugs are found.
  scope: client SDKs only — this policy does not cover REST endpoints
