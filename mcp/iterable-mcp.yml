source: https://github.com/Iterable/mcp-server — README.md and TOOLS.md read verbatim 2026-08-13; package metadata from registry.npmjs.org/@iterable/mcp
description: >-
  Iterable publishes a first-party MCP server as the npm package @iterable/mcp (repo
  github.com/Iterable/mcp-server). It is a LOCAL STDIO server: a developer installs and runs it
  with npx, and it calls the Iterable REST API with an API key stored on that machine (macOS
  Keychain, Windows DPAPI, or a 0600 file on Linux). There is no hosted/remote MCP endpoint —
  mcp.iterable.com does not resolve (NXDOMAIN, probed 2026-08-13) and api.iterable.com/mcp returns 404.
  The server defaults to read-only: PII, writes and sends are each opt-in per stored key.
deployment:
  mode: local-stdio
  install: npx -y @iterable/mcp setup
  package: https://www.npmjs.com/package/@iterable/mcp
  auth: api-key
  verified: searched
server:
  name: iterable
  transport: stdio
  package: "@iterable/mcp"
  version: 1.8.1
  published: '2026-07-09'
  repository: https://github.com/Iterable/mcp-server
  license: MIT
  requires_node: ">=20"
  endpoints: [https://api.iterable.com, https://api.eu.iterable.com]
permission_model:
  default: read-only — no PII tools, no writes, no sends
  flags:
  - name: ITERABLE_USER_PII
    grants: access to user profile data including email addresses, phone numbers and custom fields
  - name: ITERABLE_ENABLE_WRITES
    grants: create, update and delete templates, lists, catalogs, campaigns, snippets and user profiles
  - name: ITERABLE_ENABLE_SENDS
    grants: send messages, trigger campaigns and journeys, schedule and abort campaigns, track events (requires writes)
  scope: Permissions are stored per API key, so a sandbox project key and a production key can differ.
clients: [Cursor, Claude Desktop, Claude Code, Gemini CLI, Windsurf, Antigravity]
