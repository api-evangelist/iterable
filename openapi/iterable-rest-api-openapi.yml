              properties:
                campaignId:
                  type: integer
                  description: >-
                    The campaign ID to send
                recipientEmail:
                  type: string
                  description: >-
                    The recipient email address
                dataFields:
                  type: object
                  description: >-
                    Personalization data fields
                  additionalProperties: true
      responses:
        '200':
          description: Push notification sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterableResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /sms/target:
    post:
      operationId: sendSms
      summary: Send an SMS message
      description: >-
        Sends an SMS message to a specific user using a template. Supports
        personalization via data fields.
      tags:
        - SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignId
                - recipientEmail
              properties:
                campaignId:
                  type: integer
                  description: >-
                    The campaign ID to send
                recipientEmail:
                  type: string
                  description: >-
                    The recipient email address
                dataFields:
                  type: object
                  description: >-
                    Personalization data fields
                  additionalProperties: true
      responses:
        '200':
          description: SMS sent successfully
          content:
            application/json:
