  /inApp/getMessages:
    get:
      operationId: getInAppMessages
      summary: Get in-app messages for a user
      description: >-
        Retrieves pending in-app messages for a user, typically called by
        mobile or web SDKs to display in-app content.
      tags:
        - InApp
      parameters:
        - name: email
          in: query
          description: >-
            Email address of the user
          schema:
            type: string
        - name: userId
          in: query
          description: >-
            UserId of the user
          schema:
            type: string
        - name: count
          in: query
          description: >-
            Maximum number of messages to return
          schema:
            type: integer
            default: 1
        - name: platform
          in: query
          description: >-
            The platform to get messages for
          schema:
            type: string
            enum:
              - iOS
              - Android
              - Web
      responses:
        '200':
          description: In-app messages for the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  inAppMessages:
                    type: array
                    items:
                      type: object
                      properties:
                        messageId:
                          type: string
                        campaignId:
                          type: integer
                        content:
                          type: object
                          properties:
                            html:
                              type: string
                            payload:
                              type: object
                              additionalProperties: true
        '401':
          description: Unauthorized
  /messageTypes:
    get:
      operationId: listMessageTypes
      summary: List message types
      description: >-
        Retrieves all message types configured in the Iterable project.
        Message types categorize the kinds of messages sent through channels.
      tags:
        - MessageTypes
      responses:
        '200':
          description: List of message types
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        channelId:
                          type: integer
        '401':
          description: Unauthorized
  /metadata/{table}:
    get:
      operationId: getMetadataTable
      summary: Get metadata table keys
      description: >-
        Retrieves all keys in a metadata table.
      tags:
        - Metadata
      parameters:
        - name: table
          in: path
          required: true
          description: >-
            The name of the metadata table
          schema:
            type: string
      responses:
        '200':
          description: Metadata table keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: object
                          additionalProperties: true
        '401':
          description: Unauthorized
        '404':
          description: Table not found
    delete:
      operationId: deleteMetadataTable
      summary: Delete a metadata table
      description: >-
        Deletes a metadata table and all its entries.
      tags:
        - Metadata
      parameters:
        - name: table
          in: path
          required: true
          description: >-
            The name of the metadata table
          schema:
            type: string
      responses:
        '200':
          description: Metadata table deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterableResponse'
        '401':
          description: Unauthorized
  /metadata/{table}/{key}:
    get:
      operationId: getMetadataEntry
      summary: Get a metadata entry
      description: >-
        Retrieves a single metadata entry by table name and key.
      tags:
        - Metadata
      parameters:
        - name: table
          in: path
          required: true
          description: >-
            The name of the metadata table
          schema:
            type: string
        - name: key
          in: path
          required: true
          description: >-
            The key of the metadata entry
          schema:
            type: string
      responses:
        '200':
          description: Metadata entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: object
                    additionalProperties: true
        '401':
          description: Unauthorized
        '404':
          description: Entry not found
    put:
      operationId: putMetadataEntry
      summary: Create or update a metadata entry
      description: >-
        Creates or updates a metadata entry for the specified table and key.
      tags:
        - Metadata
      parameters:
        - name: table
          in: path
          required: true
          description: >-
            The name of the metadata table
          schema:
            type: string
        - name: key
          in: path
          required: true
          description: >-
            The key of the metadata entry
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: object
                  description: >-
                    The value to store
                  additionalProperties: true
      responses:
        '200':
          description: Metadata entry saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterableResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
    delete:
      operationId: deleteMetadataEntry
      summary: Delete a metadata entry
      description: >-
        Deletes a metadata entry by table name and key.
      tags:
        - Metadata
      parameters:
        - name: table
          in: path
          required: true
          description: >-
            The name of the metadata table
          schema:
            type: string
        - name: key
          in: path
          required: true
          description: >-
            The key of the metadata entry
          schema:
            type: string
      responses:
        '200':
          description: Metadata entry deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterableResponse'
        '401':
          description: Unauthorized
  /webPush/target:
    post:
      operationId: sendWebPush
      summary: Send a web push notification
      description: >-
        Sends a web push notification to a specific user using a template.
      tags:
        - WebPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignId
                - recipientEmail
              properties:
                campaignId:
                  type: integer
                  description: >-
                    The campaign ID to send
                recipientEmail:
                  type: string
                  description: >-
                    The recipient email address
                dataFields:
                  type: object
                  description: >-
                    Personalization data fields
                  additionalProperties: true
      responses:
        '200':
          description: Web push notification sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterableResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Api-Key
      description: >-
        Iterable API key passed in the Api-Key header. API keys can be
        created and managed in the Iterable project settings.
  parameters:
    emailPath:
      name: email
      in: path
      required: true
      description: >-
        Email address of the user
      schema:
        type: string
        format: email
    userIdPath:
      name: userId
      in: path
      required: true
      description: >-
        The userId of the user
      schema:
        type: string
    catalogNamePath:
      name: catalogName
      in: path
      required: true
      description: >-
        The name of the catalog
      schema:
        type: string
  schemas:
    IterableResponse:
      type: object
      description: >-
        Standard Iterable API response indicating success or failure
      properties:
        msg:
          type: string
          description: >-
            Human-readable response message
        code:
          type: string
          description: >-
            Response code indicating success or error type
        params:
          type: object
          description: >-
            Additional response parameters
          additionalProperties: true
    ErrorResponse:
      type: object
      description: >-
        Error response returned when a request fails validation
      properties:
        msg:
          type: string
          description: >-
            Error message describing what went wrong
        code:
          type: string
          description: >-
            Error code
        params:
          type: object
          description: >-
            Additional error details
          additionalProperties: true
    UserUpdateRequest:
      type: object
      description: >-
        Request body for updating a user profile
      properties:
        email:
          type: string
          format: email
          description: >-
            Email address of the user
        userId:
          type: string
          description: >-
            Unique user identifier
        dataFields:
          type: object
          description: >-
            Custom data fields to set on the user profile
          additionalProperties: true
        preferUserId:
          type: boolean
          description: >-
            Whether to prefer userId over email for identity resolution
        mergeNestedObjects:
          type: boolean
          description: >-
            Whether to merge nested objects or overwrite them
    UserResponse:
      type: object
      description: >-
        User profile response containing all user data
      properties:
        user:
          type: object
          properties:
            email:
              type: string
              format: email
              description: >-
                Email address
            userId:
              type: string
              description: >-
                User ID
            dataFields:
              type: object
              description: >-
                Custom user data fields
              additionalProperties: true
            signupDate:
              type: string
              format: date-time
              description: >-
                User signup date
            profileUpdatedAt:
              type: string
              format: date-time
              description: >-
                Last profile update timestamp
    TrackEventRequest:
      type: object
      description: >-
        Request body for tracking a custom event
      required:
        - email
        - eventName
      properties:
        email:
          type: string
          format: email
          description: >-
            Email address of the user
        userId:
          type: string
          description: >-
            UserId of the user
        eventName:
          type: string
          description: >-
            Name of the event to track
        createdAt:
          type: integer
          description: >-
            Unix timestamp of when the event occurred
        dataFields:
          type: object
          description: >-
            Additional data associated with the event
          additionalProperties: true
        campaignId:
          type: integer
          description: >-
            Campaign ID to attribute the event to
        templateId:
          type: integer
          description: >-
            Template ID to attribute the event to
    Event:
      type: object
      description: >-
        An event tracked for a user
      properties:
        eventName:
          type: string
          description: >-
            Name of the event
        createdAt:
          type: string
          format: date-time
          description: >-
            When the event was created
        dataFields:
          type: object
          description: >-
            Event data fields
          additionalProperties: true
        campaignId:
          type: integer
          description: >-
            Associated campaign ID
        templateId:
          type: integer
          description: >-
            Associated template ID
    Campaign:
      type: object
      description: >-
        A marketing campaign in Iterable
      properties:
        id:
          type: integer
          description: >-
            Campaign ID
        name:
          type: string
          description: >-
            Campaign name
        type:
          type: string
          description: >-
            Campaign type (blast, triggered, proof, etc.)
        templateId:
          type: integer
          description: >-
            Associated template ID
        createdAt:
          type: string
          format: date-time
          description: >-
            Campaign creation date
        updatedAt:
          type: string
          format: date-time
          description: >-
            Campaign last update date
        messageMedium:
          type: string
          description: >-
            Message medium (Email, Push, SMS, InApp)
          enum:
            - Email
            - Push
            - SMS
            - InApp
        campaignState:
          type: string
          description: >-
            Current state of the campaign
          enum:
            - Draft
            - Scheduled
            - Running
            - Finished
            - Cancelled
        listIds:
          type: array
          description: >-
            List IDs the campaign targets
          items:
            type: integer
        labels:
          type: array
          description: >-
            Labels applied to the campaign
          items:
            type: string
    CampaignCreateRequest:
      type: object
      description: >-
        Request body for creating a new campaign
      required:
        - name
        - listIds
        - templateId
      properties:
        name:
          type: string
          description: >-
            Campaign name
        listIds:
          type: array
          description: >-
            List IDs to target
          items:
            type: integer
        templateId:
          type: integer
          description: >-
            Template ID to use
        suppressionListIds:
          type: array
          description: >-
            List IDs for suppression
          items:
            type: integer
        sendAt:
          type: string
          format: date-time
          description: >-
            Scheduled send time in ISO 8601 format
        dataFields:
          type: object
          description: >-
            Additional data fields for personalization
          additionalProperties: true
    List:
      type: object
      description: >-
        A subscriber list in Iterable
      properties:
        id:
          type: integer
          description: >-
            List ID
        name:
          type: string
          description: >-
            List name
        createdAt:
          type: string
          format: date-time
          description: >-
            List creation date
        listType:
          type: string
          description: >-
            Type of list
        description:
          type: string
          description: >-
            List description
    Channel:
      type: object
      description: >-
        A messaging channel in Iterable
      properties:
        id:
          type: integer
          description: >-
            Channel ID
        name:
          type: string
          description: >-
            Channel name
        channelType:
          type: string
          description: >-
            Type of channel
        messageMedium:
          type: string
          description: >-
            Message medium for this channel
    EmailTemplate:
      type: object
      description: >-
        An email template
      properties:
        templateId:
          type: integer
          description: >-
            Template ID
        name:
          type: string
          description: >-
            Template name
        subject:
          type: string
          description: >-
            Email subject line
        preheaderText:
          type: string
          description: >-
            Email preheader text
        html:
          type: string
          description: >-
            HTML content of the template
        plainText:
          type: string
          description: >-
            Plain text content of the template
        fromName:
          type: string
          description: >-
            From name for the email
        fromEmail:
          type: string
          format: email
          description: >-
            From email address
        replyToEmail:
          type: string
          format: email
          description: >-
            Reply-to email address
        createdAt:
          type: string
          format: date-time
          description: >-
            Template creation date
        updatedAt:
          type: string
          format: date-time
          description: >-
            Template last update date
    EmailTemplateUpdate:
      type: object
      description: >-
        Request body for updating an email template
      required:
        - templateId
      properties:
        templateId:
          type: integer
          description: >-
            Template ID to update
        name:
          type: string
          description: >-
            Updated template name
        subject:
          type: string
          description: >-
            Updated email subject line
        preheaderText:
          type: string
          description: >-
            Updated preheader text
        html:
          type: string
          description: >-
            Updated HTML content
        plainText:
          type: string
          description: >-
            Updated plain text content
        fromName:
          type: string
          description: >-
            Updated from name
        fromEmail:
          type: string
          format: email
          description: >-
            Updated from email address
    PurchaseRequest:
      type: object
      description: >-
        Request body for tracking a purchase event
      required:
        - user
        - items
        - total
      properties:
        user:
          type: object
          description: >-
            The user who made the purchase
          properties:
            email:
              type: string
              format: email
              description: >-
                Email address of the user
            userId:
              type: string
              description: >-
                UserId of the user
            dataFields:
              type: object
              description: >-
                Additional user data fields to update
              additionalProperties: true
        items:
          type: array
          description: >-
            Array of items purchased
          items:
            $ref: '#/components/schemas/CommerceItem'
        total:
          type: number
          description: >-
            Total value of the purchase
        createdAt:
          type: integer
          description: >-
            Unix timestamp of the purchase
        dataFields:
          type: object
          description: >-
            Additional purchase data fields
          additionalProperties: true
        campaignId:
          type: integer
          description: >-
            Campaign ID to attribute the purchase to
        templateId:
          type: integer
          description: >-
            Template ID to attribute the purchase to
    CommerceItem:
      type: object
      description: >-
        A commerce item in a purchase or cart
      required:
        - id
        - name
        - price
        - quantity
      properties:
        id:
          type: string
          description: >-
            Item ID or SKU
        sku:
          type: string
          description: >-
            Item SKU
        name:
          type: string
          description: >-
            Item name
        description:
          type: string
          description: >-
            Item description
        categories:
          type: array
          description: >-
            Item categories
          items:
            type: string
        price:
          type: number
          description: >-
            Item price
        quantity:
          type: integer
          description: >-
            Quantity purchased
        imageUrl:
          type: string
          format: uri
          description: >-
            URL of the item image
        url:
          type: string
          format: uri
          description: >-
            URL of the item page
        dataFields:
          type: object
          description: >-
            Additional item data fields
          additionalProperties: true
