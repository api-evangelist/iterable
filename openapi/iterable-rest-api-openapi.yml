  /experiments/metrics:
    get:
      operationId: getExperimentMetrics
      summary: Get experiment metrics
      description: >-
        Retrieves experiment metrics for A/B tests. Supports multiple
        experiment IDs and campaign IDs as query parameters, up to 200 total.
      tags:
        - Experiments
      parameters:
        - name: experimentId
          in: query
          description: >-
            One or more experiment IDs
          schema:
            type: array
            items:
              type: integer
        - name: campaignId
          in: query
          description: >-
            One or more campaign IDs
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: Experiment metrics as CSV
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Unauthorized
  /email/target:
    post:
      operationId: sendTransactionalEmail
      summary: Send a transactional email
      description: >-
        Sends a transactional email to a specific user using a template.
        Supports personalization via data fields and attachments.
      tags:
        - Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignId
                - recipientEmail
              properties:
                campaignId:
                  type: integer
                  description: >-
                    The campaign ID to send
                recipientEmail:
                  type: string
                  description: >-
                    The recipient email address
                dataFields:
                  type: object
                  description: >-
                    Personalization data fields
                  additionalProperties: true
                attachments:
                  type: array
                  description: >-
                    File attachments
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      mimeType:
                        type: string
                      content:
                        type: string
      responses:
        '200':
          description: Email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterableResponse'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /push/target:
    post:
      operationId: sendPushNotification
      summary: Send a push notification
      description: >-
        Sends a push notification to a specific user using a template.
        Supports personalization via data fields.
      tags:
        - Push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignId
