      - users
      type: object
    GetSentMessagesResponse:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/SentMessage'
          type: array
      required:
      - messages
      type: object
    UserRequest:
      properties:
        email:
          description: An email address that identifies a user profile in Iterable. Provide an <code>email</code> or a <code>userId</code> (but not both), depending on <a href="https://support.iterable.com/hc/articles/29156459027348">how your project identifies users</a>.
          type: string
        userId:
          description: A user ID that identifies a user profile in Iterable. Provide an <code>email</code> or a <code>userId</code> (but not both), depending on <a href="https://support.iterable.com/hc/articles/29156459027348">how your project identifies users</a>.
          type: string
      type: object
    GetUserFieldsResponse:
      properties:
        fields:
          type: object
      required:
      - fields
      type: object
    BulkUpdateSubscriptionsResponse:
      properties:
        failCount:
          description: Number of users that weren't updated (due to invalid email or internal error)
          format: int64
          type: integer
        invalidEmails:
          description: A list of emails that weren't updated because they are invalid
          items:
            type: string
          type: array
        invalidUserIds:
          description: A list of userIds that weren't updated because they are invalid
          items:
            type: string
          type: array
        successCount:
          description: Number of users successfully updated
          format: int64
          type: integer
        validEmailFailures:
