specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Iterable
providerId: iterable
created: '2026-05-04'
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - Marketing
description: Iterable API rate limits per project.
sources:
  - https://www.iterable.com/pricing/
  - https://api.iterable.com/api/docs
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
limits:
  - name: Default REST API
    scope: project
    metric: requests_per_second
    limit: 30
    timeFrame: second
  - name: Bulk events
    scope: request
    metric: events
    limit: 1000
    timeFrame: request
  - name: List import
    scope: project
    metric: concurrent
    limit: 5
