specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Iterable
providerId: iterable
created: '2026-05-04'
modified: '2026-08-13'
method: searched
source: >-
  https://api.iterable.com/api-docs — Iterable publishes each endpoint's rate limit inside the
  operation description of its own Swagger contract; the rows below are read verbatim from that
  document (saved at openapi/_original/iterable-api-openapi.json). Handling guidance from
  https://support.iterable.com/hc/en-us/articles/41044692130196-Getting-Started-with-Iterable-s-API
docs: https://support.iterable.com/hc/en-us/articles/41044692130196-Getting-Started-with-Iterable-s-API
tags:
  - Rate Limiting
  - Marketing
description: >-
  Iterable applies rate limits per endpoint, and each endpoint states whether its limit is counted
  per project, per API key or per organization. Exhaustion returns HTTP 429 with the named code
  RateLimitExceeded; Iterable tells clients to retry with exponential backoff.
headers:
  retryAfter: Retry-After
  note: >-
    Iterable does not document X-RateLimit-* or RFC 9238 RateLimit-* response headers. The only
    documented runtime signal is the 429 status code; the limits themselves are published per
    endpoint in the API reference rather than returned in headers.
responseCodes:
  throttled: 429
  code: RateLimitExceeded
retry_policy: exponential backoff (documented in Getting Started with Iterable's API)
scopes_used: [per project, per API key, per organization]
limit_count: 53
